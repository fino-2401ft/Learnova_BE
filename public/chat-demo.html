<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Learnova · Chat realtime demo</title>
    <!--
      Trang thử realtime cho hai máy khác nhau, không cần frontend.

      Phục vụ tĩnh tại /static/chat-demo.html nên nó luôn cùng origin với API —
      tránh hẳn CORS trong lúc test. Mở trên hai máy, đăng nhập hai tài khoản khác
      nhau, mở cùng một hội thoại, gõ và xem tin hiện sang bên kia.

      Chỉ là công cụ kiểm thử. Frontend thật nằm ở Learnova_FE.
    -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --line: #262b36;
        --text: #e6e9ef;
        --muted: #8b93a5;
        --accent: #4c8dff;
        --mine: #2a4a86;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      input, button, select {
        font: inherit;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 7px 10px;
      }
      button { cursor: pointer; border-color: var(--accent); }
      button:disabled { opacity: 0.45; cursor: default; }
      #status { margin-left: auto; color: var(--muted); font-size: 13px; }
      #status.ok { color: #4ade80; }
      #status.err { color: #f87171; }
      main { flex: 1; display: flex; min-height: 0; }
      #sidebar {
        width: 280px;
        border-right: 1px solid var(--line);
        overflow-y: auto;
        flex-shrink: 0;
      }
      .conv {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .conv:hover { background: var(--panel); }
      .conv.active { background: var(--panel); border-left: 3px solid var(--accent); }
      .conv .title { font-weight: 600; }
      .conv .preview { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .badge {
        background: var(--accent); color: #fff; border-radius: 10px;
        padding: 0 7px; font-size: 11px; float: right;
      }
      #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
      #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
      .msg { max-width: 65%; padding: 8px 12px; border-radius: 12px; background: var(--panel); }
      .msg.mine { align-self: flex-end; background: var(--mine); }
      .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
      .msg.deleted { font-style: italic; color: var(--muted); }
      #composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
      #composer input { flex: 1; }
      .hint { color: var(--muted); padding: 24px; text-align: center; }
    </style>
  </head>

  <body>
    <header>
      <input id="email" placeholder="email" size="24" value="mentor@learnova.local" />
      <input id="password" placeholder="mật khẩu" type="password" size="16" />
      <button id="loginBtn">Đăng nhập</button>
      <span id="status">chưa kết nối</span>
    </header>

    <main>
      <div id="sidebar"><p class="hint">Đăng nhập để xem hội thoại</p></div>
      <div id="chat">
        <div id="messages"><p class="hint">Chọn một hội thoại</p></div>
        <form id="composer">
          <input id="text" placeholder="Nhập tin nhắn…" autocomplete="off" disabled />
          <button id="sendBtn" disabled>Gửi</button>
        </form>
      </div>
    </main>

    <script>
      // Cùng origin với trang này, nên chạy được cả khi mở qua IP LAN hay ngrok mà
      // không phải sửa gì.
      const API = `${location.origin}/api/v1`;

      let token = null;
      let me = null;
      let socket = null;
      let activeId = null;

      const $ = (id) => document.getElementById(id);
      const statusEl = $('status');

      function setStatus(text, kind = '') {
        statusEl.textContent = text;
        statusEl.className = kind;
      }

      async function api(path, options = {}) {
        const res = await fetch(API + path, {
          ...options,
          credentials: 'include',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { Authorization: `Bearer ${token}` } : {}),
            ...options.headers,
          },
        });

        if (res.status === 204) return null;

        const body = await res.json();
        if (!res.ok) throw new Error(body?.message || body?.code || res.status);
        return body.data;
      }

      // ---- đăng nhập ------------------------------------------------------

      $('loginBtn').onclick = async () => {
        try {
          setStatus('đang đăng nhập…');
          const data = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({
              email: $('email').value.trim(),
              password: $('password').value,
            }),
          });

          token = data.accessToken;
          me = data.user;
          setStatus(`đã đăng nhập: ${me.username} · đang nối socket…`);

          connectSocket();
          await loadConversations();
        } catch (err) {
          setStatus(`lỗi: ${err.message}`, 'err');
        }
      };

      // ---- socket ---------------------------------------------------------

      function connectSocket() {
        socket?.disconnect();

        // Token đi trong `auth`, không phải header: trình duyệt không cho đặt
        // header trên WebSocket upgrade.
        socket = io(`${location.origin}/chat`, {
          auth: { token },
          // Bỏ qua bước polling để không cần sticky session khi chạy sau proxy.
          transports: ['websocket'],
          withCredentials: true,
        });

        socket.on('connect', () => setStatus(`${me.username} · realtime ✓`, 'ok'));
        socket.on('disconnect', (r) => setStatus(`socket rớt: ${r}`, 'err'));
        socket.on('connect_error', (e) => setStatus(`socket lỗi: ${e.message}`, 'err'));

        // Tin của hội thoại đang mở.
        socket.on('message:new', (msg) => {
          if (msg.conversationId !== activeId) return;
          appendMessage(msg);
        });

        // Nudge cho danh sách: badge + thứ tự, kể cả khi đang xem hội thoại khác.
        socket.on('conversation:updated', () => loadConversations());
      }

      // ---- danh sách hội thoại -------------------------------------------

      async function loadConversations() {
        const list = await api('/me/conversations');
        const box = $('sidebar');

        if (!list.length) {
          box.innerHTML = '<p class="hint">Chưa có hội thoại nào</p>';
          return;
        }

        box.innerHTML = list
          .map(
            (c) => `
            <div class="conv ${c.conversationId === activeId ? 'active' : ''}"
                 data-id="${c.conversationId}">
              ${c.unreadCount ? `<span class="badge">${c.unreadCount}</span>` : ''}
              <div class="title">${escapeHtml(c.title)}</div>
              <div class="preview">${escapeHtml(c.lastMessage?.content ?? '…')}</div>
            </div>`,
          )
          .join('');

        box.querySelectorAll('.conv').forEach((el) => {
          el.onclick = () => openConversation(el.dataset.id);
        });
      }

      // ---- một hội thoại --------------------------------------------------

      async function openConversation(id) {
        if (activeId) socket.emit('conversation:leave', { conversationId: activeId });

        activeId = id;

        // Vào room thì mới nhận được message:new của hội thoại này. Server kiểm tra
        // participant trước khi cho vào.
        socket.emit('conversation:join', { conversationId: id }, (ack) => {
          if (ack?.error) setStatus(`không vào được room: ${ack.error}`, 'err');
        });

        const page = await api(`/conversations/${id}/messages?limit=50`);

        $('messages').innerHTML = '';
        // API trả mới nhất trước; đảo lại để đọc từ trên xuống.
        page.items.reverse().forEach(appendMessage);

        $('text').disabled = false;
        $('sendBtn').disabled = false;

        await api(`/conversations/${id}/read`, { method: 'POST' });
        await loadConversations();
      }

      function appendMessage(msg) {
        const box = $('messages');
        const mine = msg.sender.userId === me.userId;

        const el = document.createElement('div');
        el.className = `msg ${mine ? 'mine' : ''} ${msg.isDeleted ? 'deleted' : ''}`;
        el.innerHTML = `
          <div class="who">${escapeHtml(msg.sender.username)} · ${new Date(msg.createdAt).toLocaleTimeString()}</div>
          <div>${msg.isDeleted ? 'Tin nhắn đã bị xoá' : escapeHtml(msg.content ?? '')}</div>`;

        box.appendChild(el);
        box.scrollTop = box.scrollHeight;
      }

      // ---- gửi ------------------------------------------------------------

      $('composer').onsubmit = async (e) => {
        e.preventDefault();

        const content = $('text').value.trim();
        if (!content || !activeId) return;

        $('text').value = '';

        try {
          // Gửi qua REST. Tin của chính mình quay lại qua socket giống mọi người
          // khác, nên không append thủ công ở đây — nếu append, người gửi sẽ thấy
          // tin hai lần.
          await api(`/conversations/${activeId}/messages`, {
            method: 'POST',
            body: JSON.stringify({ content }),
          });
        } catch (err) {
          setStatus(`gửi lỗi: ${err.message}`, 'err');
        }
      };

      function escapeHtml(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        );
      }
    </script>
  </body>
</html>
